name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm test

      - name: Bump minor version and generate changelog
        id: meta
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          NEXT_VERSION=$(PREV_TAG="$PREV_TAG" node -e "
            const fs = require('node:fs');
            const pkgVer = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const prevTag = (process.env.PREV_TAG || '').replace(/^v/, '');
            const parse = (v) => v.split('.').map((n) => Number(n) || 0);
            const gt = (a, b) => a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2];

            if (!prevTag) {
              console.log(pkgVer);
            } else {
              const p = parse(pkgVer);
              const t = parse(prevTag);
              if (gt(p, t)) {
                console.log(pkgVer);
              } else {
                console.log(t[0] + '.' + (t[1] + 1) + '.0');
              }
            }
          ")

          TAG="v${NEXT_VERSION}"

          {
            echo "## Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --invert-grep --grep='^chore(release):' --pretty=format:"- %s (%h)"
            else
              git log --invert-grep --grep='^chore(release):' --pretty=format:"- %s (%h)"
            fi
            echo ""
          } > release-notes.md

          npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version

          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and package extension
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          npm run build:release
          npm run pack

      - name: Commit bumped version and update manifest
        run: |
          if [ -n "$(git status --porcelain package.json package-lock.json updates.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json updates.xml
            git commit -m "chore(release): ${{ steps.meta.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            release/*.zip \
            release/*.crx \
            --target main \
            --title "PR Tracker ${{ steps.meta.outputs.tag }}" \
            --notes-file release-notes.md
